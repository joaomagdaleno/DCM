sonar.projectKey=joaomagdaleno_DCM
sonar.organization=joaomagdaleno

# Point to the source code, tests, and coverage report within the 'dqcm' subdirectory.
sonar.sources=dqcm/lib
sonar.tests=dqcm/test
sonar.dart.coverage.reportPaths=dqcm/coverage/lcov.info

# Exclude auto-generated files from analysis.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart

# Encoding of the source code.
sonar.sourceEncoding=UTF-8
